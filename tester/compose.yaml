# Tester en Docker, sin instalar nada en el host.
#
#   docker compose -f tester/compose.yaml run --rm tester npm install   # la primera vez
#   docker compose -f tester/compose.yaml up                            # modo UI → http://localhost:8080
#   docker compose -f tester/compose.yaml run --rm tester npx playwright test          # sin UI
#   docker compose -f tester/compose.yaml run --rm --service-ports tester npm run report  # informe → http://localhost:9323
services:
  tester:
    # Imagen oficial de Playwright con Node y los navegadores. Su versión tiene que coincidir con @playwright/test.
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    working_dir: /work
    # Tu usuario, para que los ficheros generados no queden de root
    user: "1000:1000"
    environment:
      HOME: /tmp/home
      # Cuentas de prueba de la maqueta local (tester/mock), no de Betsson
      MOCK_USER: qa-demo
      MOCK_PASS: mock-1234
      MOCK_EMPTY_USER: qa-empty
      MOCK_EMPTY_PASS: mock-1234
    depends_on: [mock]
    # Credenciales: .env de la raíz del repo y/o tester/.env (este manda si están en los dos)
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    volumes:
      - .:/work
    ports:
      - "127.0.0.1:8080:8080"   # modo UI
      - "127.0.0.1:9323:9323"   # informe HTML
    ipc: host                   # Chromium necesita más memoria compartida
    command: npm run ui

  # Maqueta local de Betsson (:8090) + Pragmatic Play (:8091): el tester corre contra ella en modo real
  mock:
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    working_dir: /work
    user: "1000:1000"
    environment:
      MOCK_USER: qa-demo
      MOCK_PASS: mock-1234
      MOCK_EMPTY_USER: qa-empty
      MOCK_EMPTY_PASS: mock-1234
    volumes:
      - .:/work
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
    command: node mock/server.mjs

  # Centro de control: panel en directo → http://localhost:8095
  #   docker compose -f tester/compose.yaml up control
  control:
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    working_dir: /work
    user: "1000:1000"
    environment:
      HOME: /tmp/home
      MOCK_USER: qa-demo
      MOCK_PASS: mock-1234
      MOCK_EMPTY_USER: qa-empty
      MOCK_EMPTY_PASS: mock-1234
    depends_on: [mock]
    volumes:
      - .:/work
    ports:
      - "127.0.0.1:8095:8095"
    ipc: host
    command: node control/server.mjs
