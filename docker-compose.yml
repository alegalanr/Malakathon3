# Uso (desde la raíz del repo):
#   docker compose build
#   docker compose run --rm bot --check                     # comprobar el entorno
#   docker compose run --rm bot                             # flujo completo contra el casino simulado
#   docker compose run --rm bot --url https://...           # flujo completo contra otra web
#   docker compose run --rm bot --block "**/provider.html"  # FAIL provocado (demo)
#   docker compose down                                     # parar el casino simulado
services:
  # Casino simulado (mock_casino/) servido por HTTP en http://mock:8000
  mock:
    build: .
    entrypoint: ["python", "-m", "http.server", "8000", "--directory", "/app/mock_casino"]
    command: []

  bot:
    build: .
    depends_on:
      - mock
    env_file:
      - path: .env
        required: false
    environment:
      # Prevalecen sobre .env: dentro de Docker no hay pantalla ni Chrome instalado
      HEADLESS: "true"
      BROWSER_CHANNEL: ""
      # Por defecto, el casino simulado. Para otra web: docker compose run --rm bot --url https://...
      LOBBY_URL: "http://mock:8000/index.html"
    shm_size: "1gb"   # Chromium necesita más memoria compartida que la de serie
    volumes:
      - ./runs:/app/runs            # resultados de cada ejecución
      - ./auth:/app/auth            # sesión guardada (si hace falta login)
      - ./bot/data:/app/bot/data    # foto del lobby (plan B de la etapa 2)
